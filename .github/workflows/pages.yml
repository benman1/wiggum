name: Pages

# Publishes site/ to GitHub Pages. The site lives in site/ rather than docs/
# because docs/ is where wiggum keeps its own plans and summaries -- serving
# that directory would publish every workplan in the repo.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on (source: GitHub Actions) the first time this
      # runs, so the repo carries its own deploy setup instead of depending on
      # a setting somebody has to click in Settings -> Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
