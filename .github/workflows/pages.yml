name: Pages

# Publishes site/ to GitHub Pages. The site lives in site/ rather than docs/
# because docs/ is where wiggum keeps its own plans and summaries -- serving
# that directory would publish every workplan in the repo.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # No `enablement: true` here. It fails on this repo with "Resource not
      # accessible by integration": creating a Pages site needs more than the
      # GITHUB_TOKEN is granted, so Pages is enabled once, out of band, and this
      # step only reads the existing configuration.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
